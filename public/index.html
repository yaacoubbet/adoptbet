<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptBet - Live Coinflips & Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">

    <header class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h1 class="text-xl font-bold text-pink-500">AdoptBet 🐾</h1>
        <div id="connection-status" class="text-xs px-2 py-1 rounded bg-yellow-600">Connecting...</div>
    </header>

    <main class="flex-1 grid grid-cols-1 md:grid-cols-4 p-4 gap-4">
        <!-- Main Game Area -->
        <div class="md:col-span-3 bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h2 class="text-lg font-semibold mb-2">Live Coinflip Lobbies</h2>
            <p class="text-slate-400 text-sm">Active matches will appear here in real-time.</p>
        </div>

        <!-- Live Chat Sidebar -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col h-[500px]">
            <h2 class="text-lg font-semibold mb-2">Live Chat</h2>
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 mb-3 pr-2 text-sm bg-slate-950 p-3 rounded border border-slate-800"></div>
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Say something..." autocomplete="off" class="flex-1 bg-slate-800 px-3 py-2 rounded text-sm border border-slate-700 focus:outline-none focus:border-pink-500">
                <button type="submit" class="bg-pink-600 px-4 py-2 rounded text-sm font-semibold hover:bg-pink-500">Send</button>
            </form>
        </div>
    </main>

    <script>
        // Automatically switch between localhost and your live Render URL
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsUrl = window.location.hostname === 'localhost' ? 'ws://localhost:3000' : protocol + window.location.host;
        
        const ws = new WebSocket(wsUrl);
        const statusBadge = document.getElementById('connection-status');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        ws.onopen = () => {
            statusBadge.textContent = 'Connected';
            statusBadge.className = 'text-xs px-2 py-1 rounded bg-green-600';
        };

        ws.onclose = () => {
            statusBadge.textContent = 'Disconnected';
            statusBadge.className = 'text-xs px-2 py-1 rounded bg-red-600';
        };

        ws.onmessage = (event) => {
            const div = document.createElement('div');
            div.textContent = event.data;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            if (chatInput.value.trim()) {
                ws.send(chatInput.value);
                chatInput.value = '';
            }
        };
    </script>
</body>
</html>
